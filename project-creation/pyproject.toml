[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "project-creation"
version = "0.1.0"
description = "Post-award Cyber SharePoint and Planner provisioning"
requires-python = ">=3.12,<3.13"
dependencies = [
    "account-store",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "jinja2>=3.1,<4",
    "pydantic>=2.12,<3",
    "python-multipart>=0.0.20,<1",
    "rfp-automation",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2,<3",
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "pytest-socket>=0.7,<1",
    "ruff>=0.11,<1",
]

[project.scripts]
project-creation = "project_creation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
account-store = { path = "../account-store", editable = true }
rfp-automation = { path = "../rfp-automation", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
strict = true
